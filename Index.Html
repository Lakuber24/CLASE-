<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
</head>

<body>
    <div class="card">

        <div class="card-herader">
            <h1>calculadora de IMC</h1>
            <p> indice de masa corporal - igresa tus datos </p>
        </div>

        <div class="field">
            <label for="peso">peso</label>
            <div class="input-row">
                <input type="number" id="peso" placeholder="ej. 70" min="20" max="300" step="0.1" />
                <span class="unit">kg</span>
            </div>
        </div>

        <div class="field">
            <label for="estryura">estrutura</label>
            <deiv class="input-row">
                <input type="number" id="estrutura" placeholder="ej, 70" min="50" max="250" step="1" />
                <span class="unit">cm</span>
            </deiv>
        </div>

        <button onclick="calcularIMC()">calcular IMC</button>

        <div id="resultados" class="result">
            <div class="result-label">Índice de Masa Corporal</div>
            <div class="result-imc" id="valorIMC"></div>
            <div class="result-cat" id="categoria"></div>
            <div class="result-comp" id="composicion"></div>
        </div>

        <script src="Index.js"></script>

</body>

</html>
